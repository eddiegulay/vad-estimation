# Training defaults. See plan §3.5 for the memory-safety reasoning behind
# num_workers/batch_size/pin_memory choices on 16GB unified-memory Apple Silicon.

device: auto            # torch.backends.mps.is_available() -> mps, else cpu
precision: fp32          # MPS AMP support is partial as of torch 2.13; model is tiny, speed isn't the bottleneck

dataloader:
  batch_size: 64
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: false

optim:
  name: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4

# Gradient-norm clip applied before every optimizer step (GRU-based models
# can spike gradients on longer sequences); null disables clipping.
grad_clip_norm: 5.0

# Random-crop training sequences to at most this many seconds before the
# forward pass (eval always sees full sequences -- Trainer.eval_step does
# not crop). Observed MPS throughput is dominated by nn.GRU per-timestep
# dispatch overhead on long sequences (AMI's 20s windows, LibriSpeech-concat
# examples up to ~60s). Set to 20.0 (not 10.0) so AMI's full window is seen
# untruncated during training -- only rarer 40-60s LibriSpeech-concat
# outliers still get cropped. See ROADMAP known issues.
max_train_duration_s: 20.0

schedule:
  epochs: 50
  warmup_steps: 500
  # LR decays via cosine schedule from optim.lr down to this floor after
  # warmup_steps, over the remaining scheduled steps.
  min_lr_ratio: 0.01

loss:
  type: bce
  class_weighting: from_manifest

checkpoint:
  dir: checkpoints
  save_every_epochs: 1
  keep_best_metric: val_f1

env:
  pytorch_enable_mps_fallback: true

seed: 20260807
